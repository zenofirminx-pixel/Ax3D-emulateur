plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
 namespace 'com.ax3d.engine'
 compileSdk 35
 defaultConfig {
  applicationId 'com.ax3d.engine'; minSdk 23; targetSdk 35
  versionCode 4; versionName '0.4-alpha'
  ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
  externalNativeBuild { cmake { cppFlags '-std=c++17 -O2' } }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
 externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
}
